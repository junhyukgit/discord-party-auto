name: Schedule Test

on:
  schedule:
    - cron: '13 * * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Schedule Test
        run: |
          echo "SCHEDULE WORKED"
          echo "UTC: $(date -u)"
          echo "KST: $(TZ=Asia/Seoul date)"
