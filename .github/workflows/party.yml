name: Discord Webhook 연결 테스트

on:
  workflow_dispatch:

jobs:
  test-webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Discord Webhook 테스트
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          curl -i \
            -X POST \
            "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data '{"content":"[개발테스트] GitHub Actions Webhook 연결 테스트","thread_name":"GitHub Actions 테스트"}'
